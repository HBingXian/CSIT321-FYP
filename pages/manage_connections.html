<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manage Connections</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .section { margin: 16px 0; }
    .grid { display:grid; grid-template-columns:1fr auto; gap:8px 12px; align-items:center; }
    .muted { opacity:.8; font-size:.9rem; }
    .row { display:flex; gap:10px; align-items:center; }
    button { padding:6px 10px; }
    .providerTitle { margin:12px 0 6px; font-weight:600; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">Manage Connections</div>
    <button class="home-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
  </header>

  <main class="container">
    <section class="section">
      <div class="muted">Connect new service:</div>
      <div class="row">
        <button id="btnConnectGoogle">Connect Google Drive</button>
        <button id="btnConnectOneDrive">Connect OneDrive</button>
      </div>
    </section>

    <section class="section">
      <div class="providerTitle">Connected Google Accounts</div>
      <div id="googleList" class="grid"></div>
    </section>

    <section class="section">
      <div class="providerTitle">Connected OneDrive Accounts</div>
      <div id="oneDriveList" class="grid"></div>
    </section>

    <section class="section">
      <div class="providerTitle">Default Provider / Account</div>
      <div class="row">
        <select id="defaultProvider">
          <option value="">-- Select provider --</option>
          <option value="google">Google Drive</option>
          <option value="onedrive">OneDrive</option>
        </select>
        <select id="defaultAccount">
          <option value="">-- Select account --</option>
        </select>
        <button id="btnSaveDefault">Save Default</button>
      </div>
      <div id="defaultNote" class="muted" style="margin-top:6px;"></div>
    </section>
  </main>

  <footer>&copy; 2025 SecureCloud. All rights reserved.</footer>

  <script src="../js/manage_connections.js"></script>
</body>
</html>
