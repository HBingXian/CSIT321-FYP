<!DOCTYPE html>
<html>
<head>
  <title>Encrypt File</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <div class="header-title">CrypterHelper</div>
    <button class="home-btm" id="homeBtn">Back to Dashboard</button>
  </div>

  <main>
    <h2>Encrypt a File</h2>

    <label for="encryptionKeyInput">Enter your Encryption Key:</label><br>
    <input type="text" id="encryptionKeyInput" placeholder="Base64 key..." size="60"><br><br>

    <label for="fileDescriptionInput">File Description (for Google Drive only):</label><br>
    <input type="text" id="fileDescriptionInput" placeholder="Optional description..." size="60"><br><br>

    <label for="uploadDest">Upload Destination:</label><br>
    <select id="uploadDest">
      <option value="google">Google Drive</option>
      <option value="onedrive">OneDrive</option>
      <option value="local">Save Locally Only</option>
    </select><br><br>

    <button id="selectFileBtn">Select File to Encrypt</button>
    <button id="importKeyBtn">Import Key from JSON</button>

    <div id="result" style="margin-top: 20px; color: green;"></div>
  </main>

  <script src="../js/encrypt_page.js"></script>
</body>
</html>
