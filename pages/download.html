<!DOCTYPE html>
<html>
<head>
  <title>Download from Google Drive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <div class="header-title">CrypterHelper</div>
    <button class="home-btm" id="homeBtn">Back to Dashboard</button>
  </div>

  <main>
    <h2>Files in Google Drive</h2>
    <div id="fileList"></div>

    <label for="decryptKeyInput">Enter your Encryption Key:</label><br>
    <input type="text" id="decryptKeyInput" placeholder="Base64 key..." size="60"><br><br>
    <button id="downloadBtn" disabled>Download & Decrypt</button>

    <div id="result"></div>
  </main>

  <script src="../js/download_page.js"></script>
</body>
</html>
