<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Files</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-title">CrypterHelper</div>
    <button class="home-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
  </header>

  <main class="container">
    <section>
      <h3>Search Files</h3>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <input type="text" id="searchInput" placeholder="Search by name...">
        <button onclick="searchFiles()">Search</button>

        <label for="providerSelect" style="margin-left:12px;">Source:</label>
        <select id="providerSelect">
          <option value="google" selected>Google Drive</option>
          <option value="onedrive">OneDrive</option>
        </select>

        <button id="refreshFilesBtn" type="button">Refresh</button>
      </div>
    </section>

    <section>
      <h3>All Files</h3>
      <table id="fileTable">
        <thead>
          <tr>
            <th>File Name</th>
            <th>Size</th>
            <th>Modification Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="fileTableBody">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </section>
  </main>

  <footer>© 2025 CrypterHelper</footer>

  <script src="../js/view_file.js"></script>
  <script src="../js/delete_file.js"></script>
  <script src="../js/search_file.js"></script>
</body>
</html>
